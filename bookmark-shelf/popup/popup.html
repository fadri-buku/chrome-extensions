<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bookmark Shelf</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Bookmark Shelf</h1>
      </header>

      <div class="search-row">
        <input id="search-input" type="search" placeholder="Search all bookmarks…" autocomplete="off" />
      </div>

      <div id="search-results" class="list hidden"></div>

      <div id="categories-view" class="view">
        <form id="add-category-form" class="new-category-row">
          <input id="new-category-input" type="text" placeholder="New category name" autocomplete="off" />
          <button type="submit">Add</button>
        </form>
        <div id="categories-list" class="list"></div>
        <p id="categories-empty" class="empty hidden">No categories yet — add one above.</p>
      </div>

      <div id="category-view" class="view hidden">
        <div class="category-header">
          <button id="back-btn" class="icon-btn" type="button" aria-label="Back to categories">←</button>
          <h2 id="category-title"></h2>
          <button id="rename-category-btn" class="icon-btn" type="button" aria-label="Rename category">✎</button>
          <button id="delete-category-btn" class="icon-btn danger" type="button" aria-label="Delete category">🗑</button>
        </div>

        <form id="item-form" class="add-item-form">
          <input id="item-title-input" type="text" placeholder="Title" autocomplete="off" />
          <input id="item-url-input" type="text" placeholder="URL" autocomplete="off" />
          <div class="add-item-actions">
            <button id="use-current-tab-btn" type="button">Use current tab</button>
            <button id="cancel-edit-btn" type="button" class="hidden">Cancel</button>
            <button id="save-item-btn" type="submit">Add bookmark</button>
          </div>
        </form>

        <div id="items-list" class="list"></div>
        <p id="items-empty" class="empty hidden">No bookmarks in this category yet.</p>
      </div>
    </div>

    <div id="qr-overlay" class="overlay hidden">
      <div class="qr-card">
        <button id="qr-close-btn" class="icon-btn" type="button" aria-label="Close">✕</button>
        <div id="qr-title" class="qr-title"></div>
        <canvas id="qr-canvas"></canvas>
        <div id="qr-url" class="qr-url"></div>
        <button id="qr-download-btn" type="button">Download PNG</button>
      </div>
    </div>

    <script src="../lib/qrcode.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
