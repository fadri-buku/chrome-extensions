<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Window Limit Guard</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
<h1>Window Limit Guard</h1>

<label for="limit">Max Chrome windows allowed</label>
<input id="limit" type="number" min="1" step="1" />

<p id="count" class="count"></p>
<p id="status" class="status" aria-live="polite"></p>

<p class="note">
  Opening one more than this closes the newest window and folds its tabs
  into an existing one, with a notification explaining why. Incognito
  windows aren't counted.
</p>

<script type="module" src="popup.js"></script>
</body>
</html>
