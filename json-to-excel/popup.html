<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JSON to Excel</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>JSON to Excel</h1>
    <span id="status" class="status"></span>
  </header>

  <textarea id="input" spellcheck="false" placeholder="Paste JSON here (array of objects works best)…"></textarea>

  <div class="toolbar">
    <button id="download" title="Download as .xlsx (opens in Excel, Google Sheets, Numbers)">Download .xlsx</button>
    <button id="copy" title="Copy as tab-separated table, paste straight into a spreadsheet">Copy table</button>
    <button id="open" title="Load a .json file">Open file</button>
    <button id="clear" title="Clear the textarea">Clear</button>
  </div>
  <p class="hint">Nested objects become <code>a.b</code> columns; arrays of values are joined, other nested arrays are kept as JSON.</p>
  <input type="file" id="file" accept=".json,application/json" />

  <script src="popup.js"></script>
</body>
</html>
